<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Luh Twizzys</title>
    <meta name="description" content="Contact Luh Twizzys for general questions and support.">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Contact Luh Twizzys</h1>

    <p>Email: luhtwizzygng@icloud.com</p>
    <p>Phone: 012 654 5367</p>

    <form id="contactForm">

        <label for="name">Full Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label for="email">Email Address:</label>
        <input type="email" id="email" required>

        <br><br>

        <label for="type">Message Type:</label>
        <select id="type" required>
            <option value="">Select message type</option>
            <option value="General Question">General Question</option>
            <option value="Complaint">Complaint</option>
            <option value="Feedback">Feedback</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label for="message">Your Message:</label>
        <textarea id="message" required></textarea>

        <br><br>

        <button type="submit">Send Message</button>

    </form>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const type = document.getElementById("type").value;
            const message = document.getElementById("message").value;

            const subject = encodeURIComponent(type + " from " + name);
            const body = encodeURIComponent(
                "Name: " + name +
                "\nEmail: " + email +
                "\nMessage: " + message
            );

            window.location.href =
                "mailto:luhtwizzygng@icloud.com?subject=" + subject + "&body=" + body;
        });
    </script>

</body>
</html>
